# ============================================
# Bar Club - Configuracion de la aplicacion
# ============================================

# Servidor
server.port=${PORT:8080}

# Base de datos MySQL local.
# En otra máquina NO hace falta editar este archivo: definí las variables de entorno
# DB_URL, DB_USER y DB_PASSWORD (si no existen, se usan estos valores por defecto).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/barclub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:nv242409}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Serialización de fechas
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.serialization.write-dates-as-timestamps=false

# No rechazar el request si el JSON trae un campo que la entidad todavía no tiene
# (evita que un campo nuevo en el panel admin rompa el guardado de TODA la config)
spring.jackson.deserialization.fail-on-unknown-properties=false

# Datos de ejemplo al primer arranque (menú de empanadas/pizzas + 2 clientes
# de prueba). Por defecto en true para no cambiar el comportamiento de
# instalaciones existentes (ej. una instancia de demo para mostrarle la app a
# clientes potenciales, con datos falsos a propósito). Para instalar una
# instancia NUEVA ya limpia para un cliente real (sin menú de ejemplo, listo
# para cargar el menú de verdad desde el arranque), poné esta variable en
# false. Los 4 usuarios de prueba se siguen creando de cualquier manera
# (hacen falta para poder entrar la primera vez).
app.datos-ejemplo.cargar-menu=${CARGAR_MENU_EJEMPLO:true}

# Logging
logging.level.com.barclub=INFO
logging.level.org.springframework.security=WARN

# Tamaño máximo para requests con logo en base64 (hasta 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.mvc.pathmatch.use-suffix-pattern=false
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-threads=20
spring.jackson.max-nesting-depth=50

# JWT (sobreescribible con la variable de entorno JWT_SECRET)
jwt.secret=${JWT_SECRET:CambiameEnProduccionSecretJWTGenericoDelSistema2026}
jwt.expiration=86400000

# Clave maestra para recuperar contraseñas desde el login del panel.
# Ya NO vive en el HTML: la verifica el servidor. Cambiala con la variable
# de entorno MASTER_KEY (recomendado: una distinta por cada cliente instalado).
app.master-key=${MASTER_KEY:admin2026}

# ============================================
# Backup automatico de la base de datos
# ============================================
# Corre cada hora en punto por defecto con mysqldump y guarda los archivos en
# la carpeta indicada, manteniendo los ultimos N dias. Antes corria una sola
# vez al dia (04:30): con un corte de luz u otra falla justo antes de ese
# horario se podia perder casi un dia entero de pedidos y ventas. Con backups
# cada hora, como mucho se pierde lo cargado en la ultima hora. Tambien se
# puede disparar a mano desde Configuracion en el panel ("Hacer backup ahora").
# Si un local prefiere otra frecuencia, BACKUP_CRON acepta cualquier cron de
# Spring (ej: "0 30 4 * * *" para volver a una vez por dia a las 04:30, o
# "0 */30 * * * *" para cada media hora).
# El sistema BUSCA mysqldump automaticamente (PATH, rutas tipicas de MySQL/MariaDB,
# XAMPP, Laragon y Program Files). Solo completa esta ruta si la busqueda falla:
# ej: C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe
app.backup.enabled=${BACKUP_ENABLED:true}
app.backup.cron=${BACKUP_CRON:0 0 * * * *}
app.backup.dir=${BACKUP_DIR:backups}
app.backup.retention-days=${BACKUP_RETENTION_DAYS:14}
app.backup.mysqldump-path=${BACKUP_MYSQLDUMP_PATH:}

# ============================================
# Pago online con Mercado Pago (opcional)
# ============================================
# Apagado por defecto: hasta que se completen estas variables, la web pública
# solo muestra la opción de pagar al recibir, como hasta ahora. Cada
# instalación necesita SU PROPIO Access Token de Mercado Pago — el de la
# cuenta del DUEÑO DEL LOCAL (así la plata le entra a él, no a quien instaló
# el sistema). Se saca en mercadopago.com.ar/developers → Tus integraciones →
# tu aplicación → Credenciales de producción.
app.mercadopago.habilitado=${MP_HABILITADO:false}
app.mercadopago.access-token=${MP_ACCESS_TOKEN:}
# URL pública de ESTE backend (sin barra final), para que Mercado Pago le
# avise acá cuando se acredita un pago. Ej: https://tu-backend.up.railway.app
app.mercadopago.notificacion-url=${MP_NOTIFICACION_URL:}
# URL pública de la página del cliente (index.html, sin barra final), a la
# que Mercado Pago devuelve al cliente después de pagar. Ej:
# https://tusitio.netlify.app
app.mercadopago.front-url=${MP_FRONT_URL:}
